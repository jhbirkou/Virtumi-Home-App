<span class="material-symbols-outlined text-primary text-headline-md" style="font-variation-settings: 'FILL' 1;">settings_suggest</span>
</div>
</div>
<div>
<h2 class="font-headline-md text-headline-md text-on-surface leading-tight">Gerät Einstellungen</h2>

</div>
</section>
<!-- Status Card -->

<!-- Settings Grid (3x4ish) -->
<div class="grid grid-cols-3 gap-6">
<!-- 1. Geräte Info -->
<button class="flex flex-col items-center gap-3 py-6 px-2 rounded-[2rem] neumorphic-raised cursor-pointer group" style="transform: scale(1);">

</div>
<span class="font-label-sm text-label-sm text-center text-on-surface-variant leading-tight">Geräte Info</span>
</button>
<!-- 2. Datum & Uhrzeit -->
<button class="flex flex-col items-center gap-3 py-6 px-2 rounded-[2rem] neumorphic-raised cursor-pointer group" style="transform: scale(1);">
<div class="w-12 h-12 rounded-xl bg-indigo-500/10 flex items-center justify-center icon-glow-indigo">

</div>
<span class="font-label-sm text-label-sm text-center text-on-surface-variant leading-tight">Datum &amp;<br>Uhrzeit</span>
</button>
<!-- 3. Netzwerk -->
<button class="flex flex-col items-center gap-3 py-6 px-2 rounded-[2rem] neumorphic-raised cursor-pointer group">

</div>
<span class="font-label-sm text-label-sm text-center text-on-surface-variant leading-tight">Parameter</span>
</button>
<!-- 5. Cloud -->

<div class="w-12 h-12 rounded-xl bg-orange-500/10 flex items-center justify-center icon-glow-orange">

</div>
<span class="font-label-sm text-label-sm text-center text-on-surface-variant leading-tight">Geräte Ort</span>
</button>

</button>

</div>
<span class="font-label-sm text-label-sm text-center text-on-surface-variant leading-tight">Allgemeine</span>
</button>
<!-- 10. Passwort ändern -->

<script>
        // Micro-interaction for buttons
        document.querySelectorAll('.neumorphic-raised').forEach(btn => {
            btn.addEventListener('mousedown', () => {
                btn.style.transform = 'scale(0.95)';
            });
            btn.addEventListener('mouseup', () => {
                btn.style.transform = 'scale(1)';
            });
            btn.addEventListener('mouseleave', () => {
                btn.style.transform = 'scale(1)';
            });
        });
    </script>
