<style>
        body {
            background-color: #f2fbfc;
            color: #151d1e;
            min-height: max(884px, 100dvh);
        }

        /* Modern Neomorphism Shadows from SCREEN_39 */
        .neumorphic-raised {
            background: #f2fbfc;
            box-shadow: 8px 8px 16px #d1d9e6, -8px -8px 16px #ffffff;
        }

        .neumorphic-sunken {
            background: #f2fbfc;

        }

        .toggle-switch input:checked + .toggle-bg {

        }

        .icon-glow-blue { filter: drop-shadow(0 0 4px rgba(0, 123, 255, 0.5)); }

<body class="font-body-md text-body-md min-h-screen custom-scrollbar overflow-x-hidden" style="opacity: 1;">
<!-- Header Section -->
<header class="w-full px-6 max-w-lg mx-auto pt-6">
<div class="flex items-center justify-between mb-8">
<button class="w-12 h-12 rounded-full neumorphic-raised flex items-center justify-center text-on-surface-variant active:scale-95 transition-transform">
<span class="material-symbols-outlined text-[24px] text-primary">chevron_left</span>
</button>
<div class="flex items-center gap-4">
<button class="w-12 h-12 rounded-full neumorphic-raised flex items-center justify-center text-on-surface-variant active:scale-95 transition-transform">
<span class="material-symbols-outlined text-[24px] text-primary">edit</span>
</button>
<button class="w-12 h-12 rounded-full neumorphic-raised flex items-center justify-center text-on-surface-variant active:scale-95 transition-transform">
<span class="material-symbols-outlined text-[24px] text-primary">refresh</span>
</button>
</div>
</div>
<!-- Header Card -->
<section class="neumorphic-raised rounded-3xl p-5 flex items-center gap-6 mb-10" style="transform: scale(1);">
<div class="relative">
  <div class="w-16 h-16 rounded-full neumorphic-sunken flex items-center justify-center bg-blue-500/5 border border-white/60">
    <div class="relative flex items-center justify-center">
      <span class="material-symbols-outlined text-[32px] text-primary/20 absolute">schedule</span>
      <span class="material-symbols-outlined text-[32px] text-primary relative" style="font-variation-settings: 'FILL' 1;">schedule</span>
    </div>
  </div>
</div>
<div>
<h2 class="font-headline-md text-headline-md text-on-surface font-bold leading-none">Datum &amp; Uhrzeit</h2>
</div>
</section>
</header>
<main class="px-6 pb-32 max-w-lg mx-auto space-y-10">
<!-- Section 1: NTP SERVER -->
<section>
<p class="text-label-sm font-label-sm text-on-surface-variant mb-4 tracking-widest uppercase px-2">NTP SERVER</p>
<div class="neumorphic-raised rounded-3xl p-6 space-y-6">
<div class="flex items-center justify-between">
<div class="flex items-center gap-4">
<div class="w-10 h-10 rounded-xl bg-blue-500/10 flex items-center justify-center">
<span class="material-symbols-outlined text-blue-600">dns</span>
</div>
<span class="font-body-lg text-body-lg">NTP Server aktiv</span>
</div>
<label class="toggle-switch relative inline-flex items-center cursor-pointer">
<input checked="" class="sr-only peer" type="checkbox">
<div class="toggle-bg w-14 h-8 bg-primary-container rounded-full transition-all duration-300 shadow-inner">
<div class="toggle-dot absolute top-1 left-1 w-6 h-6 bg-white rounded-full shadow-md transition-transform duration-300 flex items-center justify-center translate-x-[24px]">
</div>
</div>
</label>
</div>
<div class="space-y-4">
<div class="space-y-2">
<label class="text-label-sm font-label-sm text-on-surface-variant px-1">Primärer NTP Server</label>
<input class="w-full h-14 rounded-2xl border-none neumorphic-sunken px-4 focus:ring-2 focus:ring-primary/20 text-body-md transition-all bg-transparent" type="text" value="pool.ntp.org">
</div>
<div class="space-y-2">
<label class="text-label-sm font-label-sm text-on-surface-variant px-1">Sekundärer NTP Server</label>
<input class="w-full h-14 rounded-2xl border-none neumorphic-sunken px-4 focus:ring-2 focus:ring-primary/20 text-body-md transition-all bg-transparent" type="text" value="time.google.com">
</div>
</div>
</div>
</section>
<!-- Section 2: MANUELL EINSTELLEN -->
<section>
<p class="text-label-sm font-label-sm text-on-surface-variant mb-4 tracking-widest uppercase px-2">MANUELL EINSTELLEN</p>
<div class="neumorphic-raised rounded-3xl p-6 grid grid-cols-2 gap-4">
<div class="space-y-2">
<label class="text-label-sm font-label-sm text-on-surface-variant px-1">Datum</label>
<div class="relative">
<input class="w-full h-14 rounded-2xl border-none neumorphic-sunken px-4 pr-10 focus:ring-2 focus:ring-primary/20 text-body-md transition-all bg-transparent" placeholder="TT.MM.JJJJ" type="text">
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-on-surface-variant/50">calendar_today</span>
</div>
</div>
<div class="space-y-2">
<label class="text-label-sm font-label-sm text-on-surface-variant px-1">Uhrzeit</label>
<div class="relative">

</div>
</div>
</div>
</section>

<section>

<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant/70">search</span>

</div>
<div class="bg-primary/5 rounded-2xl p-4 border border-primary/10 flex items-center justify-between group cursor-pointer hover:bg-primary/10 transition-colors">
<div class="flex items-center gap-4">
<div class="w-10 h-10 rounded-xl bg-blue-600/10 flex items-center justify-center text-blue-600">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">location_on</span>
</div>
<div>
<p class="font-body-lg text-primary font-semibold">Berlin, Deutschland</p>
<p class="text-label-sm font-label-sm text-primary/70">GMT+1</p>
</div>
</div>
<span class="material-symbols-outlined text-primary">check_circle</span>
</div>

</div>
</div>

<div class="flex items-center gap-4">

<span class="material-symbols-outlined text-orange-600">wb_sunny</span>
</div>
<div>
<span class="font-body-lg text-body-lg block">Zeitumstellung</span>
<span class="text-label-sm text-on-surface-variant">Sommer-/Winterzeit</span>
</div>
</div>
<label class="toggle-switch relative inline-flex items-center cursor-pointer">
<input checked="" class="sr-only peer" type="checkbox">
<div class="toggle-bg w-14 h-8 bg-primary-container rounded-full transition-all duration-300 shadow-inner">
<div class="toggle-dot absolute top-1 left-1 w-6 h-6 bg-white rounded-full shadow-md transition-transform duration-300 flex items-center justify-center translate-x-[24px]"></div>
</div>
</label>
</div>
</div>
</div>
</section>
<!-- Action Buttons -->

<!-- Action Buttons -->
<section class="neumorphic-raised rounded-3xl p-6 flex gap-4">
<button class="flex-1 h-14 flex items-center justify-center gap-2 rounded-2xl bg-white border border-white/60 shadow-sm hover:scale-105 active:scale-95 transition-all">
<span class="material-symbols-outlined text-error">close</span>
<span class="font-semibold text-on-surface">Abbrechen</span>
</button>

<span class="font-semibold">Speichern</span>
</button>

<!-- Bottom Navigation Bar -->
<nav class="fixed bottom-6 left-1/2 -translate-x-1/2 w-[92%] max-w-md z-50 flex justify-around items-center p-3 bg-white/40 backdrop-blur-xl shadow-lg rounded-full border border-white/60 transition-all duration-300">
<!-- Home -->
<button class="flex flex-col items-center justify-center group px-2">
<div class="w-12 h-12 flex items-center justify-center mb-1">
<span class="material-symbols-outlined text-on-surface-variant/70">home</span>
</div>
<span class="font-label-sm text-label-sm text-on-surface-variant/70">Home</span>
</button>
<!-- Szenen -->
<button class="flex flex-col items-center justify-center group px-2">
<div class="w-12 h-12 flex items-center justify-center mb-1">
<span class="material-symbols-outlined text-on-surface-variant/70">bolt</span>
</div>
<span class="font-label-sm text-label-sm text-on-surface-variant/70">Szenen</span>
</button>
<!-- Personen -->
<button class="flex flex-col items-center justify-center group px-2">
<div class="w-12 h-12 flex items-center justify-center mb-1">
<span class="material-symbols-outlined text-on-surface-variant/70">group</span>
</div>
<span class="font-label-sm text-label-sm text-on-surface-variant/70">Personen</span>
</button>
<!-- Einstellungen (Active) -->
<button class="flex flex-col items-center justify-center relative group px-2">
<div class="absolute inset-0 bg-primary/20 rounded-full blur-md -z-10 scale-125"></div>
<div class="w-12 h-12 flex items-center justify-center mb-1">
<div class="w-10 h-10 rounded-full bg-surface-variant/50 flex items-center justify-center">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">settings</span>
</div>
</div>
<span class="font-label-sm text-label-sm text-primary font-bold">Einstellungen</span>
</button>
</nav>
<script>
        // Simple micro-interaction for the back button
        document.querySelector('button').addEventListener('click', () => {
            document.body.style.opacity = '0.5';
            setTimeout(() => {
                document.body.style.opacity = '1';
                window.history.back();
            }, 100);
        });

        // Micro-interaction for toggle switches
        document.querySelectorAll('.toggle-switch input').forEach(toggle => {
            toggle.addEventListener('change', function() {
                const bg = this.nextElementSibling;
                const dot = bg.querySelector('.toggle-dot');
                if (this.checked) {
                    bg.classList.add('bg-primary-container');
                    bg.classList.remove('bg-surface-dim');
                    dot.classList.add('translate-x-[24px]');
                } else {
                    bg.classList.remove('bg-primary-container');
                    bg.classList.add('bg-surface-dim');
                    dot.classList.remove('translate-x-[24px]');
                }
            });
        });
    </script>








</body></html>
