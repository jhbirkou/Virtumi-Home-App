<script>
        // Micro-interactions for inputs to simulate the scale effect
        document.querySelectorAll('.neumorphic-raised').forEach(card => {
            card.addEventListener('mousedown', () => {
                card.style.transform = 'scale(0.98)';
                card.style.transition = 'transform 0.1s ease-out';
            });
            card.addEventListener('mouseup', () => {
                card.style.transform = 'scale(1)';
            });
            card.addEventListener('mouseleave', () => {
                card.style.transform = 'scale(1)';
            });
        });

        // Toggle effect for select/input focus
        document.querySelectorAll('input, select').forEach(el => {
            el.addEventListener('focus', () => {
                const section = el.closest('.neumorphic-raised');
                if (section) {
                    section.classList.add('neumorphic-sunken');
                    section.classList.remove('neumorphic-raised');
                }
            });
            el.addEventListener('blur', () => {
                const section = el.closest('.neumorphic-sunken');
                if (section) {
                    section.classList.remove('neumorphic-sunken');
                    section.classList.add('neumorphic-raised');
                }
            });
        });
    </script>
