<body class="min-h-screen text-on-surface pb-32 custom-scrollbar overflow-x-hidden">

<div class="flex gap-4">

<main class="px-6 pb-32 max-w-lg mx-auto space-y-10"><section class="neumorphic-raised rounded-[2.5rem] p-5 flex items-center gap-6 border border-white/40 p-4">

</div>
<div>
<h2 class="font-headline-md text-headline-md text-on-surface font-bold leading-none">Virtumi Cloud</h2>
</div>
</section>
<!-- Status Card -->
<section>
<div class="neumorphic-raised rounded-[2.5rem] p-6 relative overflow-hidden flex items-center border border-white/40"><div class="w-16 h-16 rounded-2xl bg-primary/10 flex items-center justify-center icon-glow-blue relative z-10 border border-primary/5"><span class="material-symbols-outlined text-primary text-4xl" style="font-variation-settings: 'FILL' 1;">cloud</span></div><div class="flex flex-col gap-1 relative z-10 flex-1 ml-6"><span class="font-label-sm text-label-sm text-on-surface-variant/70 uppercase tracking-widest">Verbindungsstatus</span><div class="flex items-center gap-2"><span class="w-3 h-3 rounded-full bg-emerald-500 shadow-[0_0_8px_rgba(16,185,129,0.6)] animate-pulse"></span><span class="font-headline-md text-headline-md font-bold text-on-surface">Verbunden</span></div></div><div class="absolute -right-4 -bottom-4 w-24 h-24 bg-primary/5 blur-2xl rounded-full"></div></div>
</section>
<!-- User Login Card -->
<section class="space-y-4">
<p class="text-label-sm font-label-sm text-on-surface-variant tracking-widest uppercase px-2">Benutzeranmeldung</p>
<div class="neumorphic-raised rounded-[2.5rem] p-6 flex flex-col gap-6">
<!-- Email Field -->
<div class="flex flex-col gap-2">
<label class="font-label-sm text-label-sm text-on-surface-variant px-1">E-Mail Adresse</label>
<div class="flex items-center gap-4 neumorphic-sunken p-4 rounded-2xl">
<div class="w-10 h-10 rounded-xl bg-blue-500/10 flex items-center justify-center">
<span class="material-symbols-outlined text-blue-600">mail</span>
</div>
<input class="bg-transparent border-none focus:ring-0 w-full font-body-lg text-body-lg text-on-surface" readonly="" type="email" value="max@virtumi.com">
</div>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-2">
<label class="font-label-sm text-label-sm text-on-surface-variant px-1">Passwort</label>
<div class="flex items-center gap-4 neumorphic-sunken p-4 rounded-2xl">
<div class="w-10 h-10 rounded-xl bg-indigo-500/10 flex items-center justify-center">
<span class="material-symbols-outlined text-indigo-600">lock</span>
</div>

<!-- Main Action Button -->

</button>

<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">settings</span>
</div>
</div>
<span class="font-label-sm text-label-sm text-primary font-bold">Einstellungen</span>
</button>
</nav>
<script>
    // Micro-interaction for buttons
    document.querySelectorAll('button').forEach(el => {
      el.addEventListener('mousedown', () => {
        el.style.transform = 'scale(0.95)';
      });
      el.addEventListener('mouseup', () => {
        el.style.transform = '';
      });
      el.addEventListener('mouseleave', () => {
        el.style.transform = '';
      });
    });

    // Password Toggle Logic
    const togglePassBtn = document.querySelector('button:has(.material-symbols-outlined:contains("visibility"))') || document.querySelector('button .material-symbols-outlined').parentElement;
    if(togglePassBtn) {
        togglePassBtn.addEventListener('click', function() {
            const input = this.previousElementSibling;
            const icon = this.querySelector('.material-symbols-outlined');
            if (input.type === "password") {
                input.type = "text";
                icon.innerText = 'visibility_off';
            } else {
                input.type = "password";
                icon.innerText = 'visibility';
            }
        });
    }

    // Card feedback
    document.querySelectorAll('.neumorphic-raised').forEach(card => {
        card.addEventListener('mousedown', () => {
            card.style.transform = 'scale(0.99)';
            card.style.transition = 'transform 0.1s ease-out';
        });
        card.addEventListener('mouseup', () => {
            card.style.transform = 'scale(1)';
        });
        card.addEventListener('mouseleave', () => {
            card.style.transform = 'scale(1)';
        });
    });
  </script>
