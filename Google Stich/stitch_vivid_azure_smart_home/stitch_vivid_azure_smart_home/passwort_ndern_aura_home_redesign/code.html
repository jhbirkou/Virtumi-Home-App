<div class="relative group">

</div>

<div class="absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant/50 group-focus-within:text-primary transition-colors flex items-center justify-center w-10 h-10 rounded-xl bg-orange-500/10 icon-glow-orange">

</div>

<script>
        // Micro-interaction for buttons
        document.querySelectorAll('button, a').forEach(elem => {
            elem.addEventListener('mousedown', () => {
                elem.classList.add('scale-95');
            });
            elem.addEventListener('mouseup', () => {
                elem.classList.remove('scale-95');
            });
            elem.addEventListener('mouseleave', () => {
                elem.classList.remove('scale-95');
            });
        });
    </script>
