<style>
        body {
            background-color: #f2fbfc;
            -webkit-tap-highlight-color: transparent;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .neumorphic-raised {
            background: #f2fbfc;
            box-shadow: 8px 8px 16px #d1d9e6, -8px -8px 16px #ffffff;
        }
        .neumorphic-inset {
            background: #f2fbfc;
            box-shadow: inset 4px 4px 8px #d1d9e6, inset -4px -4px 8px #ffffff;
        }
        .neumorphic-header-icon {
            box-shadow: 4px 4px 8px #d1d9e6, -4px -4px 4px #ffffff;
        }
        .glass-nav {
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 0px;
        }
    </style>

<body class="font-body-md text-on-surface min-h-screen flex flex-col items-center custom-scrollbar">
<!-- TopAppBar -->
<header class="w-full pt-12 px-6 max-w-lg mx-auto mb-4"><div class="flex justify-between items-center w-full h-12">
<button class="w-10 h-10 flex items-center justify-center rounded-full bg-surface neumorphic-header-icon hover:scale-105 active:scale-95 transition-all text-primary">
<span class="material-symbols-outlined">chevron_left</span>
</button>
</div></header>
<!-- Main Content -->
<main class="w-full max-w-lg px-6 pb-32 flex flex-col gap-6"><div class="bg-surface rounded-3xl p-6 flex items-center gap-6 neumorphic-raised mb-4">
<div class="w-14 h-14 rounded-full flex items-center justify-center shrink-0">
<img alt="Cloud Settings Icon" class="w-full h-full object-contain" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDfhehCwily3os_BYkqrI5JGhIzirlIXStVL_ksmhHT4jGOk4rCEDb3BkgW3lUFzOk7A3OpdiGJLjtVFgLhnxQ_c2_hwsbJA75QZbj5QyTidpVHapRY9dFTECEGv2eOff4zqkLE1Rcj80L7XN0Uk6x-1NDdTi0FI3R3skHxY32pmcUtu7giUJGQ32bdpbT0mw-Cfl_ycSsyyapKQEztBCQXRd_mV38khVuZ819i4aFbwqZFtrrW-QbnlWaBONKhj4FPn4aXiNrPjRQX"/>
</div>
<div class="flex-1">
<h1 class="font-headline-md text-headline-md font-bold text-on-surface">Cloud Einstellungen</h1>
</div>
</div>
<!-- Virtumi Cloud Option -->
<div class="bg-surface rounded-3xl p-6 flex items-center gap-4 neumorphic-raised hover:scale-[1.02] transition-transform duration-300 cursor-pointer group" style="transform: scale(1);">
<div class="w-14 h-14 rounded-2xl bg-primary/10 flex items-center justify-center shrink-0">
<span class="material-symbols-outlined text-primary text-[32px]" style="font-variation-settings: 'FILL' 1;">cloud</span>
</div>
<div class="flex-1">
<h3 class="font-body-lg text-body-lg font-bold text-on-surface">Virtumi Cloud</h3>
<p class="text-on-surface-variant text-sm leading-snug">Verbinden Sie Ihr Gerät mit der Virtumi Cloud</p>
<div class="flex items-center gap-1.5 mt-1">
<div class="w-2 h-2 rounded-full bg-accent-green shadow-[0_0_8px_rgba(34,197,94,0.6)]"></div>
<span class="text-xs font-semibold text-accent-green">Verbunden</span>
</div>
</div>
<span class="material-symbols-outlined text-on-surface-variant">chevron_right</span>
</div>
<!-- MQTT Cloud Option -->
<div class="bg-surface rounded-3xl p-6 flex items-center gap-4 neumorphic-raised hover:scale-[1.02] transition-transform duration-300 cursor-pointer group" style="transform: scale(1);">
<div class="w-14 h-14 rounded-2xl bg-accent-purple/10 flex items-center justify-center shrink-0">
<span class="material-symbols-outlined text-accent-purple text-[32px]" style="font-variation-settings: 'FILL' 1;">device_hub</span>
</div>
<div class="flex-1">
<h3 class="font-body-lg text-body-lg font-bold text-on-surface">MQTT Cloud</h3>
<p class="text-on-surface-variant text-sm leading-snug">Konfigurieren Sie die MQTT Verbindung</p>
<div class="flex items-center gap-1.5 mt-1">
<div class="w-2 h-2 rounded-full bg-status-error shadow-[0_0_8px_rgba(186,26,26,0.4)]"></div>
<span class="text-xs font-semibold text-status-error">Getrennt</span>
</div>
</div>
<span class="material-symbols-outlined text-on-surface-variant">chevron_right</span>
</div>
<!-- Info Card -->
<!-- Device Illustration Grid -->
<div class="grid grid-cols-2 gap-card-gap mt-4">
</div>
<!-- Footer Text -->
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-6 left-1/2 -translate-x-1/2 w-[92%] max-w-md z-50 flex justify-around items-center p-3 bg-white/40 backdrop-blur-xl shadow-lg rounded-full border border-white/60">
<!-- Home -->

<div class="w-12 h-12 flex items-center justify-center mb-1">
<span class="material-symbols-outlined text-on-surface-variant/70">home</span>
</div>
<span class="font-label-sm text-label-sm text-on-surface-variant/70">Home</span>
</button>
<!-- Szenen -->

</div>

</button>

<div class="absolute inset-0 bg-primary/20 rounded-full blur-md -z-10 scale-125"></div>
<div class="w-12 h-12 flex items-center justify-center mb-1">
<div class="w-10 h-10 rounded-full bg-surface-variant/50 flex items-center justify-center">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">settings</span>
</div>
</div>
<span class="font-label-sm text-label-sm text-primary font-bold">Einstellungen</span>
</button>
</nav>
<!-- Interaction Script -->
<script>
        document.querySelectorAll('.neumorphic-raised').forEach(card => {
            card.addEventListener('mousedown', () => {
                card.style.transform = 'scale(0.98)';
                card.style.transition = 'transform 0.1s ease-out';
            });
            card.addEventListener('mouseup', () => {
                card.style.transform = 'scale(1)';
            });
            card.addEventListener('mouseleave', () => {
                card.style.transform = 'scale(1)';
            });
        });
    </script>
</body></html>
